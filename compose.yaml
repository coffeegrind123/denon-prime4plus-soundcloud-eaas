services:
  soundcloud-eaas:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "11224:11224/udp"
      - "${SC_GRPC_PORT:-50010}:${SC_GRPC_PORT:-50010}/tcp"
      - "${SC_HTTP_PORT:-50020}:${SC_HTTP_PORT:-50020}/tcp"
    environment:
      CLIENT_ID: ${SC_CLIENT_ID:-}
      USER_AGENT: ${SC_USER_AGENT:-Mozilla/5.0}
    command:
      - --user
      - ${SC_PROFILE:?set SC_PROFILE}
      - --host-ip
      - ${SC_EAAS_HOST_IP:-}
      - --local-ip
      - ${SC_LOCAL_IP:-}
      - --cache
      - /var/cache/soundcloud-eaas
      - --max-feed-items
      - ${SC_MAX_FEED_ITEMS:-200}
      - --grpc-port
      - ${SC_GRPC_PORT:-50010}
      - --http-port
      - ${SC_HTTP_PORT:-50020}
      - --cache-max-bytes
      - ${SC_CACHE_MAX_BYTES:-536870912}
      - --cache-min-free-bytes
      - ${SC_CACHE_MIN_FREE_BYTES:-1073741824}
    volumes:
      - soundcloud-eaas-cache:/var/cache/soundcloud-eaas

volumes:
  soundcloud-eaas-cache:
